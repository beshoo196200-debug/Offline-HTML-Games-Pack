<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الألعاب العالمية الاحترافية</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: radial-gradient(circle at top, #1a1a2e 0%, #0f0f1a 100%); 
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            text-align: center;
            min-height: 100vh;
        }
        h1 { 
            font-size: 36px;
            color: #00ffcc; 
            text-shadow: 0 0 20px rgba(0,255,204,0.6); 
            margin-top: 30px;
            margin-bottom: 5px; 
            font-weight: 900;
        }
        p { color: #8a8ab3; font-size: 16px; margin-bottom: 35px; }
        
        /* شريط البحث المضيء المطور */
        .search-container { margin-bottom: 40px; }
        .search-box { 
            width: 90%; 
            max-width: 600px; 
            padding: 15px 30px; 
            border-radius: 50px; 
            border: 2px solid #00ffcc; 
            background: rgba(20, 20, 35, 0.8); 
            color: #fff; 
            font-size: 18px; 
            outline: none; 
            transition: 0.4s ease; 
            text-align: center;
            box-shadow: 0 0 15px rgba(0,255,204,0.2);
        }
        .search-box:focus { 
            box-shadow: 0 0 30px rgba(0,255,204,0.6); 
            background: #141423;
        }

        /* شبكة عرض كروت الألعاب الاحترافية الجيمينج */
        .games-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 25px; 
            max-width: 1300px; 
            margin: 0 auto; 
            padding: 10px;
        }
        .game-card { 
            background: linear-gradient(145deg, #1e1e38, #141424); 
            border: 1px solid rgba(0,255,204,0.1); 
            padding: 12px; 
            border-radius: 20px; 
            cursor: pointer; 
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }
        .game-card:hover { 
            border-color: #00ffcc; 
            transform: translateY(-8px) scale(1.02); 
            box-shadow: 0 12px 25px rgba(0,255,204,0.3); 
        }
        .game-thumb { 
            width: 100%; 
            height: 125px; 
            object-fit: cover; 
            border-radius: 15px; 
            background: #222; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .game-title { 
            font-size: 15px; 
            font-weight: bold; 
            margin-top: 12px; 
            text-transform: capitalize; 
            color: #e2e2ff; 
            letter-spacing: 0.5px;
        }
        
        /* واجهة اللعب السينمائية الفاخرة */
        #game-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; }
        .control-bar { display: flex; justify-content: space-between; align-items: center; background: #141424; padding: 10px 25px; border-bottom: 2px solid #00ffcc; height: 65px; box-sizing: border-box; }
        .btn { padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .back-btn { background: #ff3366; color: #fff; box-shadow: 0 0 10px rgba(255,51,102,0.3); }
        .back-btn:hover { background: #e02253; box-shadow: 0 0 15px rgba(255,51,102,0.5); }
        .full-btn { background: #00ffcc; color: #000; box-shadow: 0 0 10px rgba(0,255,204,0.3); }
        .full-btn:hover { background: #00ccaa; box-shadow: 0 0 15px rgba(0,255,204,0.5); }
        .iframe-container { width: 100%; height: calc(100vh - 65px); background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <h1>منصة الألعاب العالمية</h1>
    <p>بوابتك الخاصة لأقوى ألعاب الويب الـ 300 - شاشة كاملة وبدون إعلانات</p>

    <!-- شريط البحث المطور -->
    <div class="search-container">
        <input type="text" id="search-input" class="search-box" placeholder="🎮 ابحث عن لعبتك المفضلة الآن..." onkeyup="filterGames()">
    </div>

    <!-- شبكة توليد الكروت الملونة تلقائياً -->
    <div class="games-grid" id="main-grid"></div>

    <!-- واجهة تشغيل اللعبة الاحترافية -->
    <div id="game-screen">
        <div class="control-bar">
            <button class="btn back-btn" onclick="closeGame()">◄ خروج ورجوع</button>
            <h2 id="current-title" style="margin: 0; font-size: 20px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.4);">اسم اللعبة</h2>
            <button class="btn full-btn" onclick="goFull()">ملء الشاشة ⛶</button>
        </div>
        <div class="iframe-container" id="player-box">
            <iframe id="game-container" src="" allowfullscreen></iframe>
        </div>
    </div>
