<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الألعاب الـ 300 العالمية</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: radial-gradient(circle at top, #1a1a2e 0%, #0f0f1a 100%); 
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            text-align: center;
            min-height: 100vh;
        }
        h1 { 
            font-size: 32px;
            color: #00ffcc; 
            text-shadow: 0 0 20px rgba(0,255,204,0.6); 
            margin-top: 20px;
            margin-bottom: 5px; 
            font-weight: 900;
        }
        p { color: #8a8ab3; font-size: 15px; margin-bottom: 30px; }
        
        /* شريط البحث المضيء */
        .search-container { margin-bottom: 40px; }
        .search-box { 
            width: 90%; 
            max-width: 550px; 
            padding: 14px 25px; 
            border-radius: 50px; 
            border: 2px solid #00ffcc; 
            background: rgba(20, 20, 35, 0.8); 
            color: #fff; 
            font-size: 16px; 
            outline: none; 
            transition: 0.3s ease; 
            text-align: center;
            box-shadow: 0 0 15px rgba(0,255,204,0.2);
        }
        .search-box:focus { 
            box-shadow: 0 0 25px rgba(0,255,204,0.5); 
            background: #141423;
        }

        /* شبكة عرض كروت الألعاب الاحترافية */
        .games-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 10px;
        }
        .game-card { 
            background: linear-gradient(145deg, #222244, #141424); 
            border: 2px solid rgba(0,255,204,0.1); 
            padding: 15px; 
            border-radius: 18px; 
            cursor: pointer; 
            transition: 0.3s ease; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 140px;
        }
        .game-card:hover { 
            border-color: #00ffcc; 
            transform: translateY(-5px); 
            box-shadow: 0 10px 20px rgba(0,255,204,0.3); 
        }
        
        /* أيقونة اللعبة المضيئة التلقائية */
        .game-icon-box {
            width: 70px;
            height: 70px;
            border-radius: 50px;
            background: linear-gradient(135deg, #00ffcc 0%, #0077ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            color: #000;
            box-shadow: 0 0 15px rgba(0,255,204,0.4);
            margin-bottom: 12px;
        }
        .game-title { 
            font-size: 14px; 
            font-weight: bold; 
            text-transform: capitalize; 
            color: #fff; 
        }
        
        /* واجهة اللعب السينمائية الفاخرة */
        #game-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; }
        .control-bar { display: flex; justify-content: space-between; align-items: center; background: #141424; padding: 10px 25px; border-bottom: 2px solid #00ffcc; height: 65px; box-sizing: border-box; }
        .btn { padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .back-btn { background: #ff3366; color: #fff; box-shadow: 0 0 10px rgba(255,51,102,0.3); }
        .full-btn { background: #00ffcc; color: #000; box-shadow: 0 0 10px rgba(0,255,204,0.3); }
        .iframe-container { width: 100%; height: calc(100vh - 65px); background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <h1>منصة الألعاب العالمية</h1>
    <p>أهلاً بك في موقعك الخاص. ابحث عن أي لعبة من الـ 300 والعبها فوراً بحجم الشاشة الكاملة</p>

    <div class="search-container">
        <input type="text" id="search-input" class="search-box" placeholder="🎮 اكتب اسم اللعبة هنا للبحث الفوري..." onkeyup="filterGames()">
    </div>

    <!-- شبكة الكروت الجاهزة التي ستظهر تلقائياً -->
    <div class="games-grid" id="main-grid"></div>

    <!-- واجهة تشغيل اللعبة -->
    <div id="game-screen">
        <div class="control-bar">
            <button class="btn back-btn" onclick="closeGame()">◄ خروج ورجوع</button>
            <h2 id="current-title" style="margin: 0; font-size: 18px; color: #00ffcc;">اسم اللعبة</h2>
            <button class="btn full-btn" onclick="goFull()">ملء الشاشة ⛶</button>
        </div>
        <div class="iframe-container" id="player-box">
            <iframe id="game-container" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // لستة ملفات الألعاب المفرغة في حزمتك
        const gameFiles = [
            "level-devil", "1v1.lol", "moto-x3m", "subway-surfers", "1.5", "1.8", "1.12", "1-on-1-soccer", "1-on-1-tennis", "3D-flight-simulator", "8-ball-classic", "10-minutes-till-dawn", "12-mini-battles", "2048", "2048-cupcakes", "agar-io-lite", "age-of-war", "age-of-war-2", "ages-of-conflict", "among-us", "angry-birds", "awesome-tanks", "backrooms", "bacon-may-die", "bad-ice-cream", "baldis-basics", "basketball-stars", "basket-random", "bitlife", "bloons-TD-5", "blumgi-rocket", "bob-the-robber", "bowmasters", "boxing-random", "candy-crush", "capybara-clicker", "chess", "cluster-rush", "cookie-clicker", "crossy-road", "cut-the-rope", "dadish", "death-chase", "doodle-jump", "drive-mad", "duck-life-4", "eggy-car", "escape-road", "evil-glitch", "flappy-bird", "fnaf", "fruit-ninja", "geometry-dash", "granny", "happy-wheels", "helix-jump", "hole-io", "house-of-hazards", "idle-breakout", "jetpack-joyride", "learn-to-fly", "monkey-mart", "papas-freezeria", "paper-io-2", "plants-vs-zombies", "polytrack", "pou", "ragdoll-hit", "retro-bowl", "run-3", "slope", "slow-roads", "soccer-random", "space-waves", "sprunki", "stickman-hook", "superhot", "temple-run-2", "territorial-io", "the-impossible-quiz"
        ];

        const gridElement = document.getElementById('main-grid');

        // توليد الكروت تلقائياً
        gameFiles.forEach(file => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.setAttribute('data-name', file.replace(/-/g, ' '));

            const iconBox = document.createElement('div');
            iconBox.className = 'game-icon-box';
            iconBox.innerText = file.charAt(0).toUpperCase();

            const title = document.createElement('div');
            title.className = 'game-title';
            title.innerText = file.replace(/-/g, ' ');

            card.appendChild(iconBox);
            card.appendChild(title);
            
            card.onclick = () => openGame(file);
            gridElement.appendChild(card);
        });

        function openGame(fileName) {
            let cleanName = fileName.replace(/-/g, ' ');
            document.getElementById('current-title').innerText = cleanName;
            // السيرفر هيقرا ملف الـ html اللي جنبه علطول أونلاين
            document.getElementById('game-container').src = 'offline/' + fileName + '.html';
            document.getElementById('game-screen').style.display = 'block';
        }

        function closeGame() {
            document.getElementById('game-container').src = '';
            document.getElementById('game-screen').style.display = 'none';
        }

        function goFull() {
            let box = document.getElementById('player-box');
            if (box.requestFullscreen) { box.requestFullscreen(); }
            else if (box.webkitRequestFullscreen) { box.webkitRequestFullscreen(); }
            else if (box.msRequestFullscreen) { box.msRequestFullscreen(); }
        }

        function filterGames() {
            let input = document.getElementById('search-input').value.toLowerCase();
            let cards = document.getElementsByClassName('game-card');
            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getAttribute('data-name').toLowerCase();
                if (name.includes(input)) { cards[i].style.display = "flex"; } 
                else { cards[i].style.display = "none"; }
            }
        }
    </script>
</body>
</html>
