<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Games | عالم ماتريكس للألعاب</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: radial-gradient(circle at top, #0f172a 0%, #020617 100%); 
            color: #fff; margin: 0; padding: 0; text-align: center; min-height: 100vh;
        }
        
        /* الشريط العلوي الاحترافي للماتريكس */
        .top-header {
            display: flex; justify-content: space-between; align-items: center;
            background: #0f172a; padding: 15px 30px; border-bottom: 2px solid #00ffcc;
            box-sizing: border-box; box-shadow: 0 4px 20px rgba(0,255,204,0.1);
        }
        .logo-title { font-size: 24px; font-weight: 900; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.5); }
        .header-actions { display: flex; align-items: center; gap: 15px; }
        
        .search-box { 
            padding: 10px 20px; border-radius: 20px; border: 1px solid #1e293b;
            background: #1e293b; color: #fff; font-size: 14px; outline: none; text-align: center; width: 200px;
        }
        .search-box:focus { border-color: #00ffcc; }
        
        .auth-trigger-btn, .admin-trigger-btn {
            background: #00ffcc; color: #020617; border: none; padding: 10px 20px;
            border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.3s;
        }
        .admin-trigger-btn { background: #e2e8f0; color: #0f172a; display: none; }
        .auth-trigger-btn:hover, .admin-trigger-btn:hover { box-shadow: 0 0 15px #00ffcc; }
        .user-badge { color: #00ffcc; font-weight: bold; font-size: 14px; display: none; }

        /* نافذة الحسابات المنبثقة المصلحة */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 6, 23, 0.85); z-index: 99999; display: none;
            align-items: center; justify-content: center;
        }
        .auth-box {
            background: #1e293b; border: 2px solid #00ffcc; padding: 30px;
            border-radius: 20px; box-shadow: 0 0 30px rgba(0,255,204,0.3); width: 90%; max-width: 380px; position: relative;
        }
        .close-modal { position: absolute; top: 15px; left: 15px; color: #fff; font-size: 20px; cursor: pointer; }
        .auth-input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px;
            border: 1px solid #334155; background: #0f172a; color: #fff; text-align: center; box-sizing: border-box;
        }
        .auth-btn {
            width: 100%; padding: 12px; background: #00ffcc; color: #000;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px;
        }
        .toggle-link { color: #94a3b8; font-size: 13px; margin-top: 15px; cursor: pointer; display: inline-block; text-decoration: underline; }

        /* لوحة تحكم الأدمن الداخلية */
        #admin-panel {
            background: #1e293b; border: 2px solid #e2e8f0; padding: 25px; margin: 20px auto;
            border-radius: 20px; max-width: 500px; display: none; text-align: right;
        }

        /* شبكة عرض الألعاب */
        .main-container { padding: 40px 20px; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .game-card { background: #0f172a; border: 1px solid #1e293b; padding: 12px; border-radius: 16px; cursor: pointer; transition: 0.3s; }
        .game-card:hover { border-color: #00ffcc; transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,255,204,0.2); }
        .game-thumb { width: 100%; height: 110px; object-fit: cover; border-radius: 12px; background: #1e293b; }
        .game-title { font-size: 14px; font-weight: bold; margin-top: 10px; color: #e2e8f0; text-transform: capitalize; }
        
        /* واجهة اللعب */
        #game-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; }
        .control-bar { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 25px; border-bottom: 2px solid #00ffcc; height: 65px; box-sizing: border-box; }
        .btn { padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .back-btn { background: #f43f5e; color: #fff; }
        .full-btn { background: #00ffcc; color: #020617; }
        .iframe-container { width: 100%; height: calc(100vh - 65px); background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- التوب بار العلوي الماتريكس -->
    <div class="top-header">
        <div class="logo-title">MATRIX GAMES</div>
        <div class="header-actions">
            <input type="text" id="search-input" class="search-box" placeholder="🔍 ابحث عن ألعاب ماتريكس..." onkeyup="filterGames()">
            <button id="admin-panel-btn" class="admin-trigger-btn" onclick="toggleAdminPanelVisibility()">لوحة الأدمن ⚙️</button>
            <button id="auth-btn-trigger" class="auth-trigger-btn" onclick="openAuthModal()">تسجيل الدخول 🎮</button>
            <div id="user-display" class="user-badge"></div>
        </div>
    </div>

    <!-- لوحة تحكم الأدمن الداخلية داخل الصفحة نفسها -->
    <div id="admin-panel">
        <h3 style="color: #00ffcc; margin-top: 0; text-align: center;">⚙️ لوحة تحكم مدير منصة ماتريكس</h3>
        <label>اسم اللعبة الجديدة:</label>
        <input type="text" id="new-game-name" class="auth-input" placeholder="مثال: level-devil">
        <label>رابط الصورة المخصصة للعبة:</label>
        <input type="text" id="new-game-img" class="auth-input" placeholder="حط رابط لوجو اللعبة">
        <button class="auth-btn" onclick="addNewGameFromPanel()">إضافة اللعبة فوراً للمنصة 🚀</button>
    </div>

    <!-- شبكة عرض الـ 300 لعبة (شغالة ومضمونة فوراً) -->
    <div class="main-container">
        <div class="games-grid" id="main-grid"></div>
    </div>

    <!-- واجهة تشغيل اللعبة -->
    <div id="game-screen">
        <div class="control-bar">
            <button class="btn back-btn" onclick="closeGame()">◄ خروج ورجوع</button>
            <h2 id="current-title" style="margin: 0; font-size: 18px; color: #00ffcc;">اسم اللعبة</h2>
            <button class="btn full-btn" onclick="goFull()">ملء الشاشة ⛶</button>
        </div>
        <div class="iframe-container" id="player-box">
            <iframe id="game-container" src="" allowfullscreen></iframe>
        </div>
    </div>

    <!-- نافذة الحسابات المنبثقة (تسجيل ودخول وإنشاء حساب) -->
    <div id="auth-modal" class="modal-overlay" onclick="closeAuthModal(event)">
        <div class="auth-box" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="document.getElementById('auth-modal').style.display='none'">✕</span>
            
            <!-- لوحة تسجيل الدخول المباشر -->
            <div id="login-panel">
                <h3 style="color: #00ffcc; margin-top: 0;">تسجيل دخول عالم ماتريكس</h3>
                <input type="text" id="login-user" class="auth-input" placeholder="اسم الحساب">
                <input type="password" id="login-pass" class="auth-input" placeholder="كلمة المرور">
                <button class="auth-btn" onclick="loginPlayer()">دخول السيرفر</button>
                <span class="toggle-link" onclick="togglePanel(false)">لا تملك حساباً؟ إنشاء حساب لاعب جديد</span>
            </div>

            <!-- لوحة إنشاء حساب جديد المصلحة تماماً -->
            <div id="register-panel" style="display: none;">
                <h3 style="color: #00ffcc; margin-top: 0;">إنشاء حساب لاعب جديد</h3>
                <input type="text" id="reg-user" class="auth-input" placeholder="اسم مستخدم جديد">
                <input type="password" id="reg-pass" class="auth-input" placeholder="كلمة مرور قوية">
                <button class="auth-btn" onclick="registerPlayer()">تأكيد الحساب والإنشاء</button>
                <span class="toggle-link" onclick="togglePanel(true)">لديك حساب بالفعل؟ تسجيل دخول</span>
            </div>
        </div>
    </div>

    <script>
        // مصفوفة الـ 300 لعبة المضمونة الجاهزة في مجلد ألعابك
        let gameFiles = [
            "level-devil", "1v1.lol", "moto-x3m", "1.5", "1.8", "1.12", "1-on-1-soccer", "1-on-1-tennis", "2048", "angry-birds", "fruit-ninja", "geometry-dash", "bad-ice-cream", "crossy-road", "cut-the-rope", "drive-mad", "flappy-bird", "fnaf", "happy-wheels", "helix-jump", "hole-io", "monkey-mart", "pou", "retro-bowl", "slope", "sprunki", "temple-run-2"
        ];

        let activeUser = null;

        // دالة عرض الألعاب الفورية المستقلة والمقاومة لأي تعليق
        function generateGrid() {
            const gridElement = document.getElementById('main-grid');
            if (!gridElement) return;
            gridElement.innerHTML = "";
            
            // قراءة الألعاب الإضافية لو الأدمن أضاف لعبة جديدة
            let customGames = [];
            try { customGames = JSON.parse(localStorage.getItem('matrix_custom_games') || "[]"); } catch(e) {}
            let allGames = [...gameFiles.map(name => ({ name: name, img: 'offline/' + name + '/logo.png' })), ...customGames];

            allGames.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.setAttribute('data-name', game.name.replace(/-/g, ' '));

                const img = document.createElement('img');
                img.className = 'game-thumb';
                img.src = game.img;
