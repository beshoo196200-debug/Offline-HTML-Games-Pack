<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الألعاب العالمية</title>
    <style>
        body { font-family: sans-serif; background-color: #0b0b0b; color: #fff; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.3); margin-bottom: 5px; }
        p { color: #888; margin-bottom: 20px; }
        .search-container { margin-bottom: 30px; }
        .search-box { width: 90%; max-width: 500px; padding: 12px 20px; border-radius: 25px; border: 2px solid #222; background: #141414; color: #fff; font-size: 16px; outline: none; transition: 0.3s; text-align: center; }
        .search-box:focus { border-color: #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.2); }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .game-card { background: #141414; border: 2px solid #222; padding: 10px; border-radius: 12px; cursor: pointer; transition: 0.3s ease; }
        .game-card:hover { border-color: #00ffcc; transform: translateY(-5px); box-shadow: 0 0 15px rgba(0,255,204,0.1); }
        .game-thumb { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; background: #222; }
        .game-title { font-size: 14px; font-weight: bold; margin-top: 8px; text-transform: capitalize; color: #ddd; }
        #game-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; }
        .control-bar { display: flex; justify-content: space-between; align-items: center; background: #141414; padding: 10px 20px; border-bottom: 1px solid #222; height: 60px; box-sizing: border-box; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .back-btn { background: #333; color: #fff; }
        .full-btn { background: #00ffcc; color: #000; }
        .iframe-container { width: 100%; height: calc(100vh - 60px); background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <h1>منصة الألعاب العالمية</h1>
    <p>ابحث عن أي لعبة من الـ 300 والعبها فوراً بشاشة كاملة</p>

    <div class="search-container">
        <input type="text" id="search-input" class="search-box" placeholder="ابحث عن لعبتك المفضلة من هنا..." onkeyup="filterGames()">
    </div>

    <div class="games-grid" id="main-grid"></div>

    <div id="game-screen">
        <div class="control-bar">
            <button class="btn back-btn" onclick="closeGame()">◄ عودة للقائمة</button>
            <h2 id="current-title" style="margin: 0; font-size: 18px; color: #00ffcc;">اسم اللعبة</h2>
            <button class="btn full-btn" onclick="goFull()">ملء الشاشة ⛶</button>
        </div>
        <div class="iframe-container" id="player-box">
            <iframe id="game-container" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // مصفوفة مجلدات الألعاب المطابقة لملفاتك بالتمام والكمال
        const gameFolders = [
            "1.5", "1.8", "1.12", "1-on-1-soccer", "1-on-1-tennis", "1v1.lol", "3D-flight-simulator", "8-ball-classic", "10-minutes-till-dawn", "12-mini-battles", "2048", "2048-cupcakes", "agar-io-lite", "age-of-war", "age-of-war-2", "ages-of-conflict", "Alpha_1.2.6", "among-us", "angry-birds", "angry-birds-showdown", "angry-birds-space", "awesome-tanks", "awesome-tanks-2", "backrooms", "bacon-may-die", "bad-ice-cream", "bad-ice-cream-2", "bad-ice-cream-3", "bad-parenting",
            "bad-piggies", "baldis-basics", "baseball-9ross", "basketball-legends", "basketball-stars", "basket-bros", "basket-random", "Beta_1.3", "bitlife", "blf-planes", "blocky-snakes", "bloons-TD", "bloons-TD-2", "bloons-TD-3", "bloons-TD-4", "bloons-TD-5", "blazer2", "blumgi-racers", "blumgi-rocket", "bob-the-robber", "bob-the-robber-2", "bob-the-robber-5", "bouncy-motors", "bowmasters", "boxing-random", "breaking-the-bank", "bubble-shooter", "candy-crush", "capybara-clicker",
            "car-drawing", "car-king-arena", "chess", "choppy-orc", "circloo", "circloo-2", "clash-of-vikings", "cleanup-io", "cluster-rush", "cookie-clicker", "crazy-cars", "crazy-catttle-3D", "crazy-crash-landing", "crazy-motorcycle", "crossy-road", "cut-the-rope", "dadish", "dadish-2", "dadish-3", "death-chase", "death-run-3D", "demolition-derby-crash-racing", "doodle-jump", "draw-climber", "dreadhead-parkour", "drift-boss", "drive-mad", "duck-life", "duck-life-2",
            "duck-life-3", "duck-life-4", "duck-life-5", "ducklings-io", "eagle-ride", "earn-to-die", "earn-to-die-2", "eggy-car", "elastic-face", "escape-road", "escape-road-2", "escaping-the-prison", "evil-glitch", "fancy-pants-adventure", "fancy-pants-adventure-2", "fireboy-and-watergirl", "fireboy-and-watergirl-2", "fireboy-and-watergirl-3", "fireboy-and-watergirl-4", "flappy-bird", "flood-runner-2", "flood-runner-3", "flood-runner-4", "fnaf", "fnaf-2", "fnaf-3", "fnaf-4", "football-bros", "football-legends",
            "free-rider-3", "fruit-ninja", "funny-battle", "funny-battle-2", "funny-mad-racing", "funny-shooter-2", "geometry-dash", "geometry-dash-lite", "geometry-vibes", "getaway-shootout", "get-on-top", "gladi-hoppers", "google-baseball", "google-dino", "granny", "granny-2", "guess-their-answer", "hanger-2", "happy-wheels", "helix-jump", "highway-traffic", "hill-climb-racing-lite", "hole-io", "house-of-hazards", "hover-racer-drive", "idle-breakout", "Indev", "iron-snout", "jetpack-joyride",
            "johnny-trigger", "jumping-shell", "karate-bros", "kart-bros", "learn-to-fly", "learn-to-fly-2", "learn-to-fly-3", "learn-to-fly-idle", "level-devil", "madalin-stunt-cars-2", "melon-playground", "merge-round-racers", "minesweeper", "monkey-mart", "monster-tracks", "moto-x3m", "moto-x3m-2", "moto-x3m-3", "moto-x3m-pool-party", "moto-x3m-spooky-land", "moto-x3m-winter", "naob-miner", "opposite-day", "ovo", "ovo-2", "ovo-3-dimensions", "pac-man", "papas-bakeria", "papas-burgeria",
            "papas-cheeseria", "papas-cupcakeria", "papas-donuteria", "papas-freezeria", "papas-hotdoggeria", "papas-pancakeria", "papas-pastaria", "papas-pizzeria", "papas-scooperia", "papas-sushiria", "papas-taco-mia", "papas-wingeria", "paper-io-2", "parking-fury", "parking-fury-2", "parking-fury-3", "picos-school", "ping-pong-chaos", "pixel-speedrun", "plants-vs-zombies", "plonky", "polytrack", "poor-bunny", "pou", "ragdoll-archers", "ragdoll-hit", "ragdoll-soccer", "red-ball-4-vol-1", "red-ball-4-vol-2",
            "red-ball-4-vol-3", "retro-bowl", "retro-bowl-college", "retro-highway", "retro-ping-pong", "riddle-school", "riddle-school-2", "riddle-school-3", "riddle-school-4", "riddle-school-5", "riddle-transfer", "riddle-transfer-2", "rocket-soccer-derby", "rooftop-snipers", "rooftop-snipers-2", "run", "run-2", "run-3", "sand-game", "short-life", "slope", "slope-2-player", "slope-3", "slow-roads", "sm-63", "sm-64", "snowball-io", "snow-rider", "snow-load",
            "soccer-bros", "soccer-random", "spacebar-clicker", "space-is-key", "space-is-key-2", "space-waves", "speed-stars", "sprunki", "stack", "stacktris", "state-io", "stick-archers-battle", "stick-fighter", "stickman-hook", "stick-merge", "subway-surfers-beijing", "subway-surfers-havana", "subway-surfers-san-francisco", "super-bike-the-champion", "superhot", "super-liquid-soccer", "super-star-car", "table-tennis-world-tour", "tag", "tap-road", "temple-of-boom", "temple-run-2", "territorial-io", "the-impossible-quiz"
        ];

        const gridElement = document.getElementById('main-grid');

        // توليد شبكة الألعاب تلقائياً بالصور والأسماء
        gameFolders.forEach(folder => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.setAttribute('data-name', folder.replace(/-/g, ' '));

            const img = document.createElement('img');
            img.className = 'game-thumb';
            img.src = folder + '/logo.png'; 
            img.onerror = function() { this.src = 'https://placeholder.com' + folder.substring(0, 12); };

            const title = document.createElement('div');
            title.className = 'game-title';
            title.innerText = folder.replace(/-/g, ' ');

            card.appendChild(img);
            card.appendChild(title);
            
            card.onclick = () => openGame(folder);
            gridElement.appendChild(card);
        });

        function openGame(folderName) {
            let cleanName = folderName.replace(/-/g, ' ');
            document.getElementById('current-title').innerText = cleanName;
            // التعديل المباشر لفتح ملف اللعبة داخل مجلدها أونلاين
            document.getElementById('game-container').src = folderName + '/' + folderName + '.html';
            document.getElementById('game-screen').style.display = 'block';
        }

        function closeGame() {
            document.getElementById('game-container').src = '';
            document.getElementById('game-screen').style.display = 'none';
        }

        function goFull() {
            let box = document.getElementById('player-box');
            if (box.requestFullscreen) { box.requestFullscreen(); }
            else if (box.webkitRequestFullscreen) { box.webkitRequestFullscreen(); }
            else if (box.msRequestFullscreen) { box.msRequestFullscreen(); }
        }

        function filterGames() {
            let input = document.getElementById('search-input').value.toLowerCase();
            let cards = document.getElementsByClassName('game-card');
            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getAttribute('data-name').toLowerCase();
                if (name.includes(input)) { cards[i].style.display = "block"; }
