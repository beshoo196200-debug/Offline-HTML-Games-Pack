<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الألعاب العسكرية العالمية</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: radial-gradient(circle at top, #112211 0%, #050a05 100%); 
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            text-align: center;
            min-height: 100vh;
        }
        h1 { 
            font-size: 32px;
            color: #55ff55; 
            text-shadow: 0 0 20px rgba(85,255,85,0.6); 
            margin-top: 20px;
            font-weight: 900;
        }
        
        /* شاشة تسجيل الدخول العسكرية */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0a140a; z-index: 99999; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .login-box {
            background: #142414; border: 2px solid #55ff55; padding: 30px;
            border-radius: 20px; box-shadow: 0 0 30px rgba(85,255,85,0.3); width: 90%; max-width: 400px;
        }
        .login-input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px;
            border: 1px solid #55ff55; background: #050a05; color: #fff; text-align: center; box-sizing: border-box;
        }
        .login-btn {
            width: 100%; padding: 12px; background: #55ff55; color: #000;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px;
        }

        /* محتويات الموقع الرئيسي */
        #main-content { display: none; }
        .search-box { 
            width: 90%; max-width: 550px; padding: 14px 25px; border-radius: 50px; 
            border: 2px solid #55ff55; background: rgba(10, 20, 10, 0.8); color: #fff; 
            font-size: 16px; outline: none; text-align: center; box-shadow: 0 0 15px rgba(85,255,85,0.2);
        }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; max-width: 1200px; margin: 30px auto 0 auto; }
        .game-card { 
            background: linear-gradient(145deg, #193319, #0a140a); border: 2px solid rgba(85,255,85,0.1); 
            padding: 15px; border-radius: 18px; cursor: pointer; transition: 0.3s ease; min-height: 140px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .game-card:hover { border-color: #55ff55; transform: translateY(-5px); box-shadow: 0 10px 20px rgba(85,255,85,0.3); }
        .game-icon-box {
            width: 70px; height: 70px; border-radius: 50px; background: linear-gradient(135deg, #55ff55 0%, #00aa00 100%);
            display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; color: #000; box-shadow: 0 0 15px rgba(85,255,85,0.4); margin-bottom: 12px;
        }
        
        /* واجهة اللعب */
        #game-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; }
        .control-bar { display: flex; justify-content: space-between; align-items: center; background: #142414; padding: 10px 25px; border-bottom: 2px solid #55ff55; height: 65px; box-sizing: border-box; }
        .btn { padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .back-btn { background: #ff3366; color: #fff; }
        .full-btn { background: #55ff55; color: #000; }
        .iframe-container { width: 100%; height: calc(100vh - 65px); background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- بوابه نظام تسجيل الدخول العسكري للانضمام للجيش -->
    <div id="login-screen">
        <div class="login-box">
            <h2 style="color: #55ff55; margin-top: 0;">بوابة التجنيد العسكرية</h2>
            <p style="color: #8aab8a; font-size: 14px;">أدخل بياناتك العسكرية للانضمام للجيش وفتح منصة الألعاب</p>
            <input type="text" id="username" class="login-input" placeholder="اسم المقاتل (الاسم الكودي)">
            <input type="password" id="password" class="login-input" placeholder="الرقم السري العسكري">
            <button class="login-btn" onclick="checkArmyLogin()">انضمام للجيش ودخول 🎖️</button>
        </div>
    </div>

    <!-- المحتوى الرئيسي للموقع (مخفي حتى يسجل اللاعب) -->
    <div id="main-content">
        <h1>منصة الألعاب العسكرية العالمية</h1>
        <p style="color: #8aab8a;">مرحباً بك في الخدمة أيها المقاتل. اختر لعبتك الآن</p>

        <div class="search-container">
            <input type="text" id="search-input" class="search-box" placeholder="🎮 اكتب اسم اللعبة للبحث الفوري..." onkeyup="filterGames()">
        </div>

        <div class="games-grid" id="main-grid"></div>
    </div>

    <!-- واجهة تشغيل اللعبة السينمائية الكبيرة -->
    <div id="game-screen">
        <div class="control-bar">
            <button class="btn back-btn" onclick="closeGame()">◄ خروج ورجوع</button>
            <h2 id="current-title" style="margin: 0; font-size: 18px; color: #55ff55;">اسم اللعبة</h2>
            <button class="btn full-btn" onclick="goFull()">ملء الشاشة ⛶</button>
        </div>
        <div class="iframe-container" id="player-box">
            <iframe id="game-container" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // لستة الألعاب الحقيقية الجاهزة عندك فقط (تمت إزالة الألعاب غير المتاحة)
        const gameFiles = [
            "level-devil", "1v1.lol", "moto-x3m", "1.5", "1.8", "1.12", "1-on-1-soccer", "1-on-1-tennis", "2048", "angry-birds", "fruit-ninja", "geometry-dash"
        ];

        // دالة فحص تسجيل الدخول العسكري
        function checkArmyLogin() {
            let user = document.getElementById('username').value;
            let pass = document.getElementById('password').value;

            // يمكنك تغيير الاسم والرقم السري العسكري هنا كما تحب
            if(user !== "" && pass === "1234") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                generateGamesGrid();
            } else {
                alert("خطأ في البيانات العسكرية! تأكد من الرقم السري للانضمام للجيش.");
            }
        }

        function generateGamesGrid() {
            const gridElement = document.getElementById('main-grid');
            gridElement.innerHTML = "";
            gameFiles.forEach(file => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.setAttribute('data-name', file.replace(/-/g, ' '));

                const iconBox = document.createElement('div');
                iconBox.className = 'game-icon-box';
                iconBox.innerText = file.charAt(0).toUpperCase();

                const title = document.createElement('div');
                title.className = 'game-title';
                title.innerText = file.replace(/-/g, ' ');

                card.appendChild(iconBox);
                card.appendChild(title);
                card.onclick = () => openGame(file);
                gridElement.appendChild(card);
            });
        }

        function openGame(fileName) {
            let cleanName = fileName.replace(/-/g, ' ');
            document.getElementById('current-title').innerText = cleanName;
            document.getElementById('game-container').src = 'offline/' + fileName + '.html';
            document.getElementById('game-screen').style.display = 'block';
        }

        function closeGame() {
            document.getElementById('game-container').src = '';
            document.getElementById('game-screen').style.display = 'none';
        }

        function goFull() {
            let box = document.getElementById('player-box');
            if (box.requestFullscreen) { box.requestFullscreen(); }
            else if (box.webkitRequestFullscreen) { box.webkitRequestFullscreen(); }
        }

        function filterGames() {
            let input = document.getElementById('search-input').value.toLowerCase();
            let cards = document.getElementsByClassName('game-card');
            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getAttribute('data-name').toLowerCase();
                if (name.includes(input)) { cards[i].style.display = "flex"; } 
                else { cards[i].style.display = "none"; }
            }
        }
    </script>
</body>
</html>
